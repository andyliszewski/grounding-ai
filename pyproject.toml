[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounding-ai"
version = "0.3.0"
description = "Local-first document corpus pipeline for grounded AI agents"
authors = [{name = "Andy Liszewski"}]
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
keywords = ["rag", "retrieval", "embeddings", "corpus", "local-first", "faiss", "document-processing", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "unstructured>=0.15.0",
    "pdfminer.six>=20231228",
    "langchain-text-splitters>=0.2.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "ujson>=5.10",
    "blake3>=0.4.1",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.0",
    "music21>=9.1.0",
    "pillow>=10.0.0",
    "mido>=1.2.0",
    "pix2tex>=0.1.2",
    "pypdfium2>=4.0.0",
    "scipy>=1.10.0",
    "typer>=0.9.0",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
# Corpus-search MCP server (mcp_servers/corpus_search). Not part of the
# published ingestion package's runtime deps — install with
# `pip install -e .[mcp]` to run the server locally. The heavy retrieval
# deps it needs (faiss-cpu, sentence-transformers, torch, rank_bm25, pyyaml)
# are already in [project.dependencies]; only mcp + starlette are extra.
# starlette is floored at >=1.0.1 for CVE-2026-48710 ("BadHost"): older
# Starlette fails to validate the Host header and poisons request.url.path.
# It arrives transitively via mcp (floored only at >=0.27); the explicit
# floor keeps a known-vulnerable build out of dev installs. Mirrors the
# floor pinned in the MCP server Dockerfile.
mcp = [
    "mcp>=1.0.0",
    "starlette>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/andyliszewski/grounding-ai"
Repository = "https://github.com/andyliszewski/grounding-ai"
Issues = "https://github.com/andyliszewski/grounding-ai/issues"

[project.scripts]
grounding = "grounding.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grounding*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external resources (PDFs, models, filesystem pipelines)",
    "slow: tests slow enough to exclude from default CI unit-test runs",
]
