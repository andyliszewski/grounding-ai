name: ci

# PR-only. The push-to-main trigger was removed deliberately: `main` now carries
# branch protection with `strict: true` (a branch must be up to date with main before
# it can merge) and `enforce_admins: true` (nobody, including the owner, can push
# directly), so the only tree that can reach main is one the required `test` check
# already passed on. The push-triggered run was re-testing that identical tree a
# second time: 21 of the 55 jobs run between 2026-04-14 and 2026-07-30 (~38%) were
# that duplicate. `workflow_dispatch` stays as the manual escape hatch for running ci
# against main on demand.
#
# `test` is the only required check. `eval` is deliberately NOT required, because
# eval.yml is path-filtered: a required check whose workflow gets skipped by a path
# filter stays "Pending" forever and the PR can never merge. GitHub's own guidance is
# not to use path filtering on workflows that are required to pass before merging.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/sentence_transformers
            ~/.cache/huggingface
          key: st-${{ runner.os }}-all-MiniLM-L6-v2-v1

      - name: Install grounding-ai and test deps
        run: |
          # CPU-only PyTorch: CI has no GPU, and the default CUDA build (over 2 GB of
          # NVIDIA wheels) has exceeded both the job timeout and the runner's disk.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[mcp]"
          pip install pytest

      - name: Cache mini FAISS index
        id: cache-mini-index
        uses: actions/cache@v4
        with:
          path: tests/eval_fixtures/mini_index
          key: mini-index-${{ runner.os }}-${{ hashFiles('tests/eval_fixtures/mini_corpus/**/*.md', 'tests/eval_fixtures/mini_corpus/_index.json', 'grounding/embedder.py', 'grounding/vector_store.py', 'grounding/bm25.py') }}

      - name: Build mini FAISS + BM25 index
        if: steps.cache-mini-index.outputs.cache-hit != 'true'
        run: |
          grounding embeddings \
            --corpus tests/eval_fixtures/mini_corpus \
            --out tests/eval_fixtures/mini_index

      - name: Run unit tests
        run: pytest -m "not integration and not slow" --tb=short -q
