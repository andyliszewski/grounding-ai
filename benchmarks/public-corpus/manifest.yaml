# Public-domain benchmark corpus for the Epic 25 grounded-answer benchmark.
#
# Every entry is a US federal government work (17 U.S.C. 105) or carries a public-release
# distribution statement, so anyone can rebuild the corpus from this file alone:
#
#   ./venv/bin/python benchmarks/public-corpus/fetch.py            # download + verify SHA-256
#   benchmarks/public-corpus/build.sh                              # fetch, ingest, embed
#
# Field guide (one mapping per document, under `documents:`):
#   id            short kebab slug; the PDF is saved as originals/<id>.pdf and the corpus slug
#                 is derived from that filename, so id == corpus slug
#   number        document number, revision and date
#   url           the URL fetch.py tries first; fallback_url is tried when url fails
#   collections   corpus collection tags passed to `grounding --collections` at ingestion
#   sha256/bytes  of the file as fetched; recorded by `fetch.py --record`, verified afterwards
#   pages         PDF page count (pypdf, falling back to pdfinfo), recorded by --record
#   last_modified the HTTP Last-Modified header seen at fetch time (FDA re-posts PDFs at the
#                 same URL, so this plus sha256 pins the edition actually used)
#   fetched_from  "url" or "fallback_url", whichever produced the recorded hash
#   public_basis  why the document is public, as one of these keys (see README.md):
#                 [G] 17 U.S.C. 105; [F] FDA website policy; [N] NASA Technical Standards
#                 System "Internet Public"; [T] NTRS distribution PUBLIC; [A] Distribution
#                 Statement A on the cover; [Q] ASSIST QuickSearch Dist Stmt A; [R] DTIC public
#                 site carries only unclassified, unlimited reports
#   category_hint benchmark question categories the document is likely to back:
#                 table | formula | standard | guidance | judgment
#
# Sources vetted 2026-09-14 against the agency landing pages, NTRS, OSTI, the Federal
# Register API and DLA ASSIST; each entry's public basis is recorded below. This file was
# written by hand and is rewritten in place by fetch.py --record, which keeps this header
# and the field order.

