# Document identifiers, for checking an identifier an ungrounded citation names. A citation
# that names one of these only matches the document that carries it: one digit out is a
# different document (FDA-2013-D-1531 is not FDA-2013-D-1530, 21 CFR 820 is not 21 CFR 888).
# The recognized designation styles are in grounding/eval/answers/citations.py (_ID_SERIES
# plus the CFR, FDA docket, Federal Register and DOT report patterns). A value may be a list
# when a document is known by more than one designation. An FDA guidance keeps its docket
# across revisions, so the docket is identity here and the issue date is the revision above.
