# Epic 25 answer benchmark: PUBLIC question set for the implant-eng-public agent.
# Corpus: benchmarks/public-corpus/ (25 US government documents; see README.md and
# inventory.md). Everything here may be published; the doc_ids below are from the
# 2026-09-14 build and are listed with their slugs in inventory.md.
#
# How to write an item:
#   1. Write the question from your own knowledge, worded the way you would ask it at work.
#      Do not use corpus search to pick questions; that biases the set toward what retrieval
#      already finds. Note how you located the page afterwards.
#   2. Find the answer in the PDF and record the PDF page index: the number in the viewer's
#      page box, counting from the first page of the file. Not the printed page number.
#   3. Use the doc_id from inventory.md (it is the first 8 characters of the corpus
#      document hash, not of the PDF). Every document in this corpus has page metadata, so
#      any of the 25 can back an answerable item.
#
# Checklist (from the 2026-09-14 methodology review):
#   - Every cited document has a page_offsets entry below (0 if printed equals PDF page, or
#     `section` for a section-paged work like MIL-HDBK-5J "3-98" or the DOE handbooks
#     "MS-01 Page 12"). The offsets were measured at one or two sample pages; confirm the
#     offset at the page you cite before relying on it. Avoid section-paged works for
#     page-based questions.
#   - Every document has a revisions entry (revision letter, year, or a guidance date such as
#     "September 2023") and an identifiers entry (document number, or a list of them), so
#     ungrounded citations that name them can be checked.
#     None of these documents carries an edition number, so `editions:` is unused.
#   - Numeric items: state the unit the gold uses; rel_tol 0.02 for table values, abs_tol 0
#     for integers; one number per question.
#   - Formula items: no numeric block; must_include the symbols, the form and its limits.
#   - Judgment items: 2 to 3 concrete must_include points.
#   - Unanswerable items: pick a kind (below) and record how you confirmed the answer is
#     absent (dense search, BM25 and a text search).
#   - Aim for at least 10 items Claude is unlikely to have memorized (specific clauses,
#     guidance details, obscure tables: FDA performance-criteria values, NASA-STD-5020B
#     equation numbers, MIL-STD-882E table cells, 21 CFR 888 section numbers).
#   - Prefer answers of one to two sentences.
#   - MIL-HDBK-5J is half the corpus by chunk count; do not let it be half the questions.
#
# Target 30 to 50 items:
#   table 8-10 | formula 8-10 | standard 6-8 | guidance 4-6 | judgment 4-6 | unanswerable 4-6
# No confidential details: no device geometry, no project specifics, no client names.

agent: implant-eng-public
version: 1

