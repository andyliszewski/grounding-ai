items:
  # FORMAT EXAMPLE ONLY. It shows every field and fails validation on purpose (page 0);
  # delete it before the first run.
  - id: example-delete-me
    query: "<the question, worded the way you would ask it at work>"
    expected:
      doc_ids: ["<doc_id from inventory.md>"]
      page: 0                  # PDF page index, or [start, end]
      section: "<optional: section or table label>"
    tags: ["table"]
    answer:
      category: table          # table | formula | standard | guidance | judgment | unanswerable
      gold: "<short gold answer, in your words>"
      numeric:                 # delete this block if the answer is not a number
        value: 0
        unit: "<unit>"
        rel_tol: 0.02          # or abs_tol, not both
      must_include: []         # optional: key facts a correct answer must state
      answerable: true

  # An unanswerable item. Two kinds:
  #   no_source: no reliable source answers it as asked (false premise, missing information,
  #              unpublished data); scored in every condition.
  #   not_in_corpus: published elsewhere but absent from this library (for example a value
  #              that lives in MMPDS, an ASTM standard or ISO 14971); scored for grounded
  #              conditions only.
