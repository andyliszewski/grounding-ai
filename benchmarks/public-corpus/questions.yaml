  # DRAFT (Claude). Source: "the use of a 'split predicate' is inconsistent with the 510(k) regulatory standard" [fda-510k-program-substantial-equivalence-2014, p.14]
  - id: pub-202
    query: "Our new bone plate has the same intended use as cleared plate A, but its locking design and material match cleared device B, which has a different intended use. Can we cite A for the intended use and B for the technology to claim substantial equivalence?"
    expected:
      doc_ids: ["dff0cd46"]
      page: 14
      section: "IV.C Predicate Device(s), split predicate"
    tags: ["judgment", "author-claude-draft"]
    answer:
      category: judgment
      gold: "No. Matching intended use to one device and technological characteristics to a second device with a different intended use is a split predicate, which FDA considers inconsistent with the 510(k) standard; FDA must be able to work through decision points 1 to 4 (intended use and technological characteristics) with one predicate."
      must_include:
        - "No: this is a split predicate, which FDA considers inconsistent with the 510(k) standard."
        - "FDA must be able to address decision points 1 through 4 (intended use and technological characteristics) using one predicate."
      answerable: true

  # DRAFT (Claude). Source: "decision consequence should be based on the specific question of interest and not on the specific device class" [fda-cms-credibility-2023, p.18]
  - id: pub-203
    query: "We're using FEA to support the fatigue claim in a 510(k) for a class II implant. A colleague says the model needs less credibility evidence than it would in a PMA, because the device is only class II. Is that right?"
    expected:
      doc_ids: ["6715aa83"]
      page: [17, 18]
      section: "VI.A.(3) Model risk"
    tags: ["judgment", "author-claude-draft"]
    answer:
      category: judgment
      gold: "No. FDA says decision consequence should be judged on the specific question of interest, not on the device class, so a 510(k) question can carry the same or greater decision consequence than a PMA question. The credibility needed follows model risk, which combines model influence (how much the FEA counts against bench or other evidence) with decision consequence (the harm if the decision is wrong, such as the implant fracturing)."
      must_include:
        - "No: decision consequence depends on the specific question of interest, not on the device class."
        - "A 510(k) question can have the same or greater decision consequence than a PMA question."
        - "Model risk, which sets the credibility needed, combines model influence and decision consequence."
      answerable: true

