  # DRAFT (Claude). Source: "a crack will propagate when the stress intensity factor reaches the critical value" [faa-damage-tolerance-handbook-vol1, p.62]; "a function of crack length and key structural dimensions such as plate width" [p.63]
  - id: pub-403
    query: "When I check whether a through crack in a finite-width plate will run, how is the mode I stress intensity factor written, and what condition makes the crack critical?"
    expected:
      doc_ids: ["9a46f5c3"]
      page: [62, 63]
      section: "Stress intensity factor, Equation (2-10) and Figure 2-7"
    tags: ["formula", "author-claude-draft"]
    answer:
      category: formula
      gold: "K_I = beta x sigma x sqrt(pi a) (Eq. 2-10), where beta is a function of crack length and structural dimensions such as plate width; for a crack much smaller than the plate it reduces to K_I = sigma x sqrt(pi a) (Eq. 2-5). The crack propagates when K_I reaches the critical value K_c (Eq. 2-7)."
      must_include:
        - "K_I = beta sigma sqrt(pi a), with a geometry factor that depends on crack length and plate width (any symbol for it)"
        - "for a crack much smaller than the plate the factor is 1: K_I = sigma sqrt(pi a)"
        - "the crack propagates when K_I reaches the critical value K_c"
      answerable: true

