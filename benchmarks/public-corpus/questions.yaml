  # DRAFT (Claude). Source: "a. The fracture of the part does not cause a catastrophic hazard. b. The release of the mass does not cause a catastrophic hazard." [nasa-std-5019a-chg4, p.44]
  # Note: 5019A sets no fixed mass limit (text searched); an answer quoting a mass threshold is not from this standard.
  - id: pub-303
    query: "For human-rated spaceflight hardware, what has to be shown before a small part can be treated as non-fracture-critical because only a small mass would be released if it broke?"
    expected:
      doc_ids: ["edf7995e"]
      page: 44
      section: "6.2.1 NFC Low-Released Mass"
    tags: ["standard", "author-claude-draft"]
    answer:
      category: standard
      gold: "That the fracture of the part does not cause a catastrophic hazard and that the release of the mass does not cause a catastrophic hazard, with damage to impacted composite or bonded parts, loss of function and impact with other hardware and personnel addressed; external parts also need an accepted debris-field criterion. The criteria are hazard-based, not a mass limit."
      must_include:
        - "fracture of the part does not cause a catastrophic hazard"
        - "release of the mass does not cause a catastrophic hazard"
      answerable: true

  # DRAFT (Claude). Source: "The commonly assumed value for K is 0.2, but this value should not be used blindly." [nasa-rp-1228-fastener-design-manual, p.21]
  # Note: the one textbook-level item in this group (T = KFd); the manual's 0.15 steel-on-steel value is what discriminates. Printed page 17.
  - id: pub-304
    query: "For a quick estimate of the tightening torque that gives the preload I want, what formula should I use, and what torque coefficient is realistic for steel on steel?"
    expected:
      doc_ids: ["987bcc1c"]
      page: 21
      section: "Alternative Torque Formula"
    tags: ["formula", "author-claude-draft", "likely-known"]
    answer:
      category: formula
      gold: "T = K F d, torque equals the torque coefficient times the axial preload times the bolt diameter, where K is calculated from the thread mean diameter, helix angle, thread angle and the thread and head or nut friction coefficients. The commonly assumed K = 0.2 should not be used blindly; about 0.15 is a more realistic typical value for steel on steel."
      must_include:
        - "T = K F d, with T torque, F axial load (preload) and d bolt diameter"
        - "K depends on the thread and bearing-surface friction coefficients and the thread geometry"
        - "K of about 0.15 for steel on steel rather than a blanket 0.2"
      answerable: true

  # DRAFT (Claude). Source: "For the case in which the threads are in the shear plane, as is typically the case for a bolt going into a tapped hole" [nasa-std-5020b, p.33]
  # Note: Eq. 22 is on p.33; Psu-allow per Eq. 13 (minimum minor-diameter area) is referenced on p.34. The full-diameter-body case (Eq. 20) uses exponents 2.5 and 1.5 instead.
  - id: pub-305
    query: "When a bolt threads into a tapped hole, so the shear plane passes through the threads, what tension-shear interaction check at ultimate does NASA-STD-5020B give if I don't take credit for plastic bending?"
    expected:
      doc_ids: ["f327d38b"]
      page: [33, 34]
      section: "4.4.4 Combination of Loads, Eq. 22"
    tags: ["formula", "author-claude-draft"]
    answer:
      category: formula
      gold: "(Psu/Psu-allow)^1.2 + (Ptu/Ptu-allow + fbu/Ftu)^2 <= 1 (Eq. 22), where Psu-allow = Fsu x Am with Am the minimum minor-diameter area of the threads (Eq. 13), fbu the linear-elastic ultimate bending stress and Ftu the allowable ultimate tensile stress. Preload may be omitted at ultimate, and including the bending term is conservative."
      must_include:
        - "shear ratio Psu/Psu-allow raised to the power 1.2"
        - "tension plus bending ratio (Ptu/Ptu-allow + fbu/Ftu) raised to the power 2"
        - "the sum must be less than or equal to 1"
      answerable: true

  # DRAFT (Claude). Source: "The elongation of the bar is directly proportional to the tensile force and the length of the bar" [doe-hdbk-1017-1-material-science-v1, p.63]
  - id: pub-401
    query: "How do I estimate how much a bar stretches under an axial pull, and over what range of stress does that estimate hold?"
    expected:
      doc_ids: ["775f74b8"]
      page: 63
      section: "Hooke's Law, Equation (2-3) (MS-02, Properties of Metals)"
    tags: ["formula", "author-claude-draft", "likely-known"]
    answer:
      category: formula
      gold: "Elongation is delta = PL/(AE), with P the axial force, L the bar length, A the cross-sectional area and E Young's modulus; it holds only in the elastic range, where strain is proportional to stress (Hooke's law)."
      must_include:
        - "delta = PL/(AE)"
        - "P is the axial force, L the length, A the cross-sectional area, E Young's modulus"
        - "valid only in the elastic range, where strain is proportional to stress"
      answerable: true

