  # DRAFT (Claude). Source: "A passive implant with dimensions of less than 2 cm in all directions and at least 3 cm away from another passive implant does not need to be tested" [fda-mr-safety-testing-labeling-2023, p.12]
  - id: pub-106
    query: "A single titanium bone anchor, about 12 mm long and 5 mm across, is fully implanted with no other implant within 5 cm. For MR Conditional labeling at 1.5 T and 3 T, do we need to run RF heating tests on it?"
    expected:
      doc_ids: ["31fa320d"]
      page: 12
      section: "RF induced heating"
    tags: ["guidance", "author-claude-draft"]
    answer:
      category: guidance
      gold: "No. A passive implant under 2 cm in every direction and at least 3 cm from any other passive implant does not need RF heating testing at 3.0 T or below, because it is expected to heat less than 2 °C over 1 hour in Normal Operating Mode. The exclusion does not apply to several replicas within 3 cm of each other or to an implant partly outside the patient."
      must_include:
        - "no RF heating test needed at 3.0 T or below"
        - "under 2 cm in all directions"
        - "at least 3 cm from another passive implant"
      answerable: true

