items:
  # ANDY'S QUESTION (wording as in benchmark.txt, 2026-09-15). Source: "Class I (general
  # controls) for a goniometer that does not use electrode lead wires and patient cables"
  # [cfr-21-part-888-2025, p.5]
  - id: pub-001
    query: "What is the device classification (class III, II, I) of a powered goniometer without electrode lead wires and patient cables?"
    expected:
      doc_ids: ["0ce2b093"]
      page: 5
      section: "§ 888.1500(b)(1)"
    tags: ["standard", "author-andy"]
    answer:
      category: standard
      gold: "Class I (general controls), exempt from 510(k) premarket notification subject to the limitations in § 888.9."
      must_include: ["Class I"]
      answerable: true

  # ANDY'S QUESTION. Note: at work you would say "pedicle screw"; your call. Source: "Class II
  # (special controls), when a semi-rigid system is intended to provide immobilization and
  # stabilization" [cfr-21-part-888-2025, p.11]
  - id: pub-002
    query: "What classification is a semi-rigid thoracolumbosacral medical screw system?"
    expected:
      doc_ids: ["0ce2b093"]
      page: [10, 11]
      section: "§ 888.3070(a)(2) definition, (b)(3) classification"
    tags: ["standard", "author-andy"]
    answer:
      category: standard
      gold: "Class II (special controls), for any indication as an adjunct to fusion. Beyond the rigid-system special controls, it must show clinical performance data supporting the intended use, including fusion compared with a clinically acceptable fusion rate."
      must_include: ["Class II"]
      answerable: true

