  # ANDY'S QUESTION. Source: "operation be limited above the FTE temperature, or NDT + 60°F.
  # Under such conditions, no brittle fracture can occur" [doe-hdbk-1017-2-material-science-v2,
  # p.39, printed MS-04 Page 5]
  - id: pub-005
    query: "For a load that doesn't cause plastic deformation, what conditions must be met so no brittle fracture can occur?"
    expected:
      doc_ids: ["41ec5758"]
      page: 39
      section: "MS-04, Brittle Fracture"
    tags: ["judgment", "author-andy"]
    answer:
      category: judgment
      gold: "Operate above the nil-ductility transition (NDT) temperature, and for greater safety above the FTE temperature, NDT + 60°F; under those conditions no brittle fracture can occur for purely elastic loads."
      must_include: ["operate above the NDT temperature", "for margin, above the FTE temperature, NDT + 60°F"]
      answerable: true

  # DRAFT (Claude). Source: "Class II (special controls). ... In vivo performance testing ... histopathological and histomorphometric assessment" [cfr-21-part-888-2025, p.8]
  - id: pub-101
    query: "A sleeve that is implanted around a metal bone screw that has lost its grip in bone, to restore fixation: what FDA class is it, and what does the regulation require the in vivo testing to show?"
    expected:
      doc_ids: ["0ce2b093"]
      page: 8
      section: "§ 888.3043"
    tags: ["standard", "author-claude-draft"]
    answer:
      category: standard
      gold: "It is a screw sleeve bone fixation device, Class II with special controls (21 CFR 888.3043). In vivo testing must show the device gives enough stability for the fracture to heal and causes no adverse biologic response, assessed by histopathology and histomorphometry."
      must_include:
        - "Class II (special controls), 21 CFR 888.3043"
        - "in vivo testing shows enough stability for fracture healing"
        - "no adverse biologic response, by histopathological and histomorphometric assessment"
      answerable: true

